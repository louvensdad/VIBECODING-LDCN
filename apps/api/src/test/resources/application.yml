spring:
  datasource:
    url: jdbc:h2:mem:vibecode;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    # Mirrors the main configuration: without it the test context falls back to the default and
    # warns on every run.
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

vibecode:
  security:
    auth-rate-limit:
      # Generous on purpose. Every test in this suite arrives from the same MockMvc address, so a
      # realistic origin limit would make unrelated tests throttle each other. The tests that are
      # actually about throttling set their own tiny limits with @TestPropertySource.
      enabled: true
      trusted-proxies: []
      max-tracked-keys: 50000
      login:
        identifier:
          capacity: 10000
          window: 15m
        origin:
          capacity: 10000
          window: 15m
      register:
        identifier:
          capacity: 10000
          window: 1h
        origin:
          capacity: 10000
          window: 1h
