spring:
  datasource:
    url: jdbc:h2:mem:vibecode;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    # Mirrors the main configuration: without it the test context falls back to the default and
    # warns on every run.
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

# Repeated from the main application.yml, not inherited. A test-classpath application.yml of the
# same name replaces the main one rather than merging with it, so omitting this block here would
# leave the whole suite running under the defaults the fix exists to correct — and the tests that
# assert nothing leaks would then be asserting it about a configuration production does not use.
# The reasoning behind each line lives in apps/api/src/main/resources/application.yml; if that list
# changes, this one has to change with it.
logging:
  level:
    org.hibernate.orm.jdbc.bind: INFO
    org.hibernate.orm.jdbc.extract: INFO
    org.hibernate.internal.util.EntityPrinter: INFO
    org.hibernate.resource.jdbc.internal.ResourceRegistryStandardImpl: INFO

vibecode:
  security:
    auth-rate-limit:
      # Generous on purpose. Every test in this suite arrives from the same MockMvc address, so a
      # realistic origin limit would make unrelated tests throttle each other. The tests that are
      # actually about throttling set their own tiny limits with @TestPropertySource.
      enabled: true
      trusted-proxies: []
      max-tracked-keys: 50000
      login:
        identifier:
          capacity: 10000
          window: 15m
        origin:
          capacity: 10000
          window: 15m
      register:
        identifier:
          capacity: 10000
          window: 1h
        origin:
          capacity: 10000
          window: 1h

  vault:
    enabled: true
    key-provider: LOCAL
    local:
      # Base64 of the ASCII bytes "vibecode-test-vault-key-32-bytes" — a fixed, obviously synthetic
      # key so the suite is deterministic. It is a test fixture, not a secret: it decrypts nothing
      # that exists outside an in-memory database created and dropped by the test run.
      master-key: dmliZWNvZGUtdGVzdC12YXVsdC1rZXktMzItYnl0ZXM=
      key-version: test-v1
