spring:
  datasource:
    url: jdbc:h2:mem:vibecode;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    # Mirrors the main configuration: without it the test context falls back to the default and
    # warns on every run.
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

# Repeated from the main application.yml, not inherited. A test-classpath application.yml of the
# same name replaces the main one rather than merging with it, so omitting this block here would
# leave the whole suite running under the defaults the fix exists to correct — and the tests that
# assert nothing leaks would then be asserting it about a configuration production does not use.
# The reasoning behind each line lives in apps/api/src/main/resources/application.yml; if that list
# changes, this one has to change with it.
logging:
  level:
    org.hibernate.orm.jdbc.bind: INFO
    org.hibernate.orm.jdbc.extract: INFO
    org.hibernate.internal.util.EntityPrinter: INFO
    org.hibernate.resource.jdbc.internal.ResourceRegistryStandardImpl: INFO
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: INFO
    org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor: INFO
    org.springframework.web.method.HandlerMethod: INFO
    org.hibernate.validator.internal.engine.resolver.JPATraversableResolver: INFO

# Declared debt, and it lives here because it is a property of the test run rather than of any one
# test. Logback's LoggerContext is JVM-wide, and Spring Boot never unsets what a
# @TestPropertySource applied to it: once a test class raises `logging.level.org.hibernate` to
# DEBUG, that explicit level outlives its application context and every later capture in the same
# JVM sees org.hibernate's descendants at DEBUG rather than at whatever the root was set to. A
# capture can therefore observe less than it appears to, depending on class ordering, which is a
# trap for anyone writing the next test in this package — assert on what must not be present, not
# on what must.
#
# It does not weaken any pin. Each category above carries an explicit level of its own, and an
# explicit level is not overridden by an inherited one, so the guarantee holds however the
# surrounding levels drift. What it weakens is a test's ability to see a leak that is there.
vibecode:
  security:
    auth-rate-limit:
      # Generous on purpose. Every test in this suite arrives from the same MockMvc address, so a
      # realistic origin limit would make unrelated tests throttle each other. The tests that are
      # actually about throttling set their own tiny limits with @TestPropertySource.
      enabled: true
      trusted-proxies: []
      max-tracked-keys: 50000
      login:
        identifier:
          capacity: 10000
          window: 15m
        origin:
          capacity: 10000
          window: 15m
      register:
        identifier:
          capacity: 10000
          window: 1h
        origin:
          capacity: 10000
          window: 1h

  vault:
    enabled: true
    key-provider: LOCAL
    local:
      # Base64 of the ASCII bytes "vibecode-test-vault-key-32-bytes" — a fixed, obviously synthetic
      # key so the suite is deterministic. It is a test fixture, not a secret: it decrypts nothing
      # that exists outside an in-memory database created and dropped by the test run.
      master-key: dmliZWNvZGUtdGVzdC12YXVsdC1rZXktMzItYnl0ZXM=
      key-version: test-v1
