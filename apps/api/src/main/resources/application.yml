spring:
  application:
    name: vibecode-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vibecode}
    username: ${DATABASE_USERNAME:vibecode}
    password: ${DATABASE_PASSWORD:vibecode_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

# Nothing a user typed reaches a log line through the categories that print values as a matter of
# course, whether the request succeeds or is rejected.
#
# The second half of that sentence was missing for three rounds of this work, and the gap was real:
# every probe exercised requests that worked, so the route a value takes out of a *failed* one went
# unexamined until someone sent a bad request on purpose. If you extend this list, send one.
#
# That is the boundary these levels draw, and it is narrower than "nothing leaks". What they cover
# is one value's whole journey through three layers on one request: Spring MVC deserializing the
# request body, writing the response, and reporting a validation failure; Bean Validation walking
# the object; and Hibernate binding parameters, extracting them, dumping the entity at flush and
# releasing the statement. What they do not cover is a driver building a value into an exception
# message, which is a different mechanism at a different level and is described under "Known
# residual" below.
#
# All of that happens below the application: a task objective, a Brain entry or a piece of evidence
# is printed by the framework itself, and no redaction inside any module of this codebase can reach
# those call sites. The only defence is not emitting.
#
# THE RULE, so this list can be checked rather than trusted: pin every category that prints a
# user-supplied object as a matter of course — routinely, on the ordinary path, without anyone
# asking it to. Not every category that could print one; that is the blind switch-off this list
# exists to avoid. A category that prints an object only under some unusual condition is a decision
# to be taken and recorded, not a tenth line nobody can justify later.
#
# All nine were found by capturing every event at TRACE during a real persist and a real HTTP
# request, then grouping by logger name — not by copying a list from another version or another
# codebase. That is why `org.hibernate.type.descriptor.sql.BasicBinder`, the Hibernate 5 name most
# advice still repeats, is absent: it does not exist in 6.6.8.Final. It is also why the list
# contains `HttpEntityMethodProcessor` and `ResourceRegistryStandardImpl`, which no list of usual
# suspects would have offered. Re-run that probe rather than reasoning about it when the versions
# move: the categories have changed name across releases before.
#
# These levels sit in the profile-independent document on purpose. A profile-specific block would
# only protect the profiles that happen to exist today; here, every profile inherits them, and an
# explicit level on a logger wins over the level inherited from its parent — so `--debug`, or
# `logging.level.org.hibernate=DEBUG`, raises the surrounding noise without reopening these.
#
# Turning any of them back on means naming that one category and choosing TRACE or DEBUG for it
# deliberately, in an environment where the operator accepts that the log file now contains user
# data. That is the intended escape hatch, and it should never be a standing setting.
#
# Known residual, reachable today: `org.hibernate.engine.jdbc.spi.SqlExceptionHelper` logs the
# driver's exception message, and the driver builds that message out of the value that caused the
# failure. It logs at ERROR, so no level pin can reach it and no operator has to opt in — an
# ordinary constraint violation is enough. On H2 an over-length column produces
# `Value too long for column "title CHARACTER VARYING(200)": "'<the value>...`; on PostgreSQL,
# pgjdbc copies the server's DETAIL line into the message, which carries the conflicting key for a
# unique violation and every column of the row for a check violation. What keeps this narrow is
# validation upstream — the web DTO @Size maxima match their column lengths — not anything here.
# Closing it properly needs a Logback TurboFilter or MessageConverter in src/main/java, or
# `logServerErrorDetail=false` on the JDBC URL, which costs real diagnostic value and does nothing
# for H2. That is a deliberate trade and it has not been made.
#
# This note is not an inventory, and should not be read as one. Once the driver has built the value
# into an exception message, that message travels wherever the exception does:
# `org.springframework.transaction.interceptor.TransactionInterceptor` carries it too, at TRACE,
# and unlike SqlExceptionHelper that one is pin-reachable. It is deliberately not pinned. Silencing
# the second vehicle while the first still emits at ERROR would lengthen this list without changing
# what ends up in the log file, which is the security theatre the rule at the top exists to
# prevent. The thing that would actually matter is closing the ERROR-level path; until then, assume
# any category that logs an exception can carry the value, and treat the list above as covering the
# categories that print values deliberately, not every route an exception can take.
#
# One boundary deliberately left alone: request URIs. Spring logs the query string at DEBUG, so a
# free-text value in a @RequestParam or a path variable would appear there. Nothing in this API
# does that today — the only request parameters are a boolean and an int, and no path variable
# carries free text — so the exposure is a design constraint to keep, not a category to pin.
#
# Known residual, not reachable today: `org.hibernate.SQL_SLOW` logs `statement.toString()`, which
# the H2 and pgjdbc drivers render with the bound values substituted. It logs at INFO, so a level
# pin would not stop it either — what stops it is that Hibernate only records slow queries when
# `hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS` is set, and this application never sets
# it. Setting it would reintroduce the leak.
logging:
  level:
    # "binding parameter (3:VARCHAR) <- [<the value>]" — every parameter of every statement.
    org.hibernate.orm.jdbc.bind: INFO
    # "extracted value (…) -> [<the value>]" — the same leak on the way back out of the database.
    org.hibernate.orm.jdbc.extract: INFO
    # Prints every field of every entity in the session at flush: the defect as originally
    # reported. Its caller, org.hibernate.event.internal.AbstractFlushingEventListener, is left
    # alone so its flush counts stay available at DEBUG; those are counts, not values.
    org.hibernate.internal.util.EntityPrinter: INFO
    # Logs the JDBC statement object itself when releasing it. Harmless-looking, and the least
    # obvious of the four: both H2 and pgjdbc include the bound parameters in the statement's
    # toString, so this line carries the values even though the message never asks for them.
    org.hibernate.resource.jdbc.internal.ResourceRegistryStandardImpl: INFO
    # org.hibernate.SQL is deliberately NOT pinned, and neither are the query-compilation
    # categories such as org.hibernate.orm.query.hql. They print the statement as it was built, so
    # they are safe for exactly as long as this codebase's statements are built the way they are
    # now — every query parameterized, nothing concatenating a user value into JPQL, HQL or SQL.
    # That is a property of the queries, not of the logger: an inlined literal would be printed
    # verbatim, and org.hibernate.orm.query.hql prints at DEBUG, which `--debug` reaches. Keep the
    # queries parameterized and this stays true; the statement log with its `?` placeholders is
    # what a developer actually needs when diagnosing a query, which is why it is left on.

    # The same defect one layer up. Before Hibernate ever sees a task objective, Spring MVC has
    # deserialized it into a DTO and printed that DTO — full at TRACE, truncated at DEBUG, which
    # `--debug` reaches. Found the same way as the Hibernate list: an HTTP POST carrying the
    # fixture, captured at TRACE and grouped by logger, rather than from a list of likely names.
    # Spring routes the body through LogFormatUtils.traceDebug with no category of its own for it,
    # so the category is the only lever there is; pinning it also costs the content-negotiation
    # DEBUG line from the same class, which is a real if small loss.
    # "Read "application/json" to [CreateTaskRequest[... objective=<the value> ...]]", and
    # "Writing [...]" for the response DTO on the way back out.
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: INFO
    # The ResponseEntity sibling of the above. Controllers here return both shapes, so pinning one
    # without the other would leave whichever half happened to be used unguarded.
    org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor: INFO
    # "Arguments: [...]" — the controller's resolved parameters, the deserialized body among them.
    org.springframework.web.method.HandlerMethod: INFO
    # Bean Validation, not Spring MVC — a different library on the same request. It prints the
    # object it is walking once per constrained field, so a four-field DTO produces four copies of
    # the body. Being in a different package than the processors above is a fact about Maven
    # coordinates and no comfort to the person whose objective leaked; it prints the body on the
    # ordinary path, so the rule at the top of this block puts it here.
    org.hibernate.validator.internal.engine.resolver.JPATraversableResolver: INFO
    # The rejected request, which every probe on this task missed until someone thought to send
    # one. "Resolved [MethodArgumentNotValidException: ... Field error in object 'registerRequest'
    # on field 'password': rejected value [<the whole value>]" — Spring's FieldError.toString
    # carries the offending argument, and this resolver prints the exception at DEBUG before
    # ApiExceptionHandler, which never echoes it, gets to run. For a public API a validation
    # failure is not an unusual condition; it is Tuesday, and it is the one path where the value
    # in the log line is disproportionately likely to be a password.
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: INFO

server:
  port: ${SERVER_PORT:9000}
  servlet:
    session:
      cookie:
        http-only: true
        # Off for local http development; set SESSION_COOKIE_SECURE=true wherever the app is
        # served over TLS, which is everywhere that is not a developer's machine.
        secure: ${SESSION_COOKIE_SECURE:false}
        # The web app and the API share an origin, so Lax keeps the cookie off cross-site
        # requests without breaking anything the app itself does.
        same-site: lax
      timeout: 12h

management:
  endpoints:
    web:
      exposure:
        # Only health is exposed at all. env, configprops, heapdump, beans and mappings would
        # each hand out something an attacker wants, and none of them is needed to run the app.
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      # No component detail to anonymous callers: it would report which datastores exist.
      show-details: never
      show-components: never
info:
  app:
    name: VibeCode API

vibecode:
  security:
    auth-rate-limit:
      enabled: true
      # Peers whose X-Forwarded-For may be believed. EMPTY BY DEFAULT, and that matters: the
      # Next.js rewrite passes a client-supplied X-Forwarded-For straight through, so listing it
      # here would let any browser mint unlimited origin buckets. Only list a proxy that
      # OVERWRITES the header with the address it accepted the connection from.
      trusted-proxies: []
      # Upper bound on buckets held in memory, so inventing identifiers cannot exhaust the heap.
      max-tracked-keys: 50000
      login:
        # Per account being targeted, from anywhere.
        identifier:
          capacity: 10
          window: 15m
        # Per client address, whatever accounts it names.
        origin:
          capacity: 30
          window: 15m
      register:
        identifier:
          capacity: 5
          window: 1h
        origin:
          capacity: 10
          window: 1h

  vault:
    enabled: true
    key-provider: LOCAL
    local:
      # Base64 of exactly 32 random bytes, supplied by the environment. There is deliberately no
      # fallback value: an application that invents a key when the variable is missing would
      # start happily and leave every previously stored credential undecryptable. Missing means
      # the application does not start.
      master-key: ${VIBECODE_VAULT_MASTER_KEY:}
      # Recorded next to every ciphertext, so a future key rotation can tell which rows were
      # wrapped with which key.
      key-version: ${VIBECODE_VAULT_KEY_VERSION:local-v1}
