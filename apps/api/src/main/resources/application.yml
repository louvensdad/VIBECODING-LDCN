spring:
  application:
    name: vibecode-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vibecode}
    username: ${DATABASE_USERNAME:vibecode}
    password: ${DATABASE_PASSWORD:vibecode_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
info:
  app:
    name: VibeCode API
